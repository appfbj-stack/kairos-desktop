<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>{{title}} - Slide {{slide_number}}/{{total_slides}}</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1080px;
      font-family: 'Georgia', 'Times New Roman', serif;
      background: #f5efe6;
      color: #1a2540;
      overflow: hidden;
    }
    .frame {
      width: 100%;
      height: 100%;
      padding: 80px 70px;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .slide-num {
      position: absolute;
      top: 40px;
      right: 50px;
      font-family: 'Arial', sans-serif;
      font-size: 20px;
      color: #d4a017;
      font-weight: 700;
      letter-spacing: 2px;
    }
    .label {
      font-family: 'Arial', sans-serif;
      font-size: 22px;
      font-weight: 800;
      color: #d4a017;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 30px;
    }
    .title {
      font-family: 'Georgia', serif;
      font-size: 72px;
      font-weight: 900;
      color: #1a2540;
      line-height: 1.05;
      margin-bottom: 40px;
      letter-spacing: 1px;
    }
    .body {
      font-family: 'Georgia', serif;
      font-size: 30px;
      color: #1a2540;
      line-height: 1.5;
      flex: 1;
    }
    .body p { margin-bottom: 20px; }
    .verses {
      font-family: 'Georgia', serif;
      font-size: 32px;
      font-style: italic;
      color: #1a2540;
      text-align: center;
      background: #fff;
      padding: 30px 40px;
      border-left: 8px solid #d4a017;
      border-radius: 8px;
      margin: 30px 0;
      line-height: 1.4;
    }
    .verses .ref {
      display: block;
      font-style: normal;
      font-weight: 700;
      margin-top: 16px;
      color: #d4a017;
      font-size: 24px;
    }
    .cta {
      background: #1a2540;
      color: #f5efe6;
      padding: 30px 40px;
      border-radius: 12px;
      text-align: center;
      font-family: 'Arial', sans-serif;
      margin-top: 30px;
    }
    .cta .headline {
      font-size: 36px;
      font-weight: 800;
      color: #d4a017;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }
    .cta .sub {
      font-size: 22px;
      font-weight: 400;
    }
    .footer {
      margin-top: auto;
      padding-top: 30px;
      border-top: 2px solid #1a2540;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'Arial', sans-serif;
    }
    .footer .church {
      font-size: 18px;
      font-weight: 800;
      color: #1a2540;
      letter-spacing: 1px;
    }
    .footer .church .tagline {
      font-size: 13px;
      color: #d4a017;
      font-weight: 400;
      font-style: italic;
    }
    .footer .cta-link {
      font-size: 18px;
      color: #1a2540;
      font-weight: 700;
    }
    .footer .page {
      font-size: 18px;
      color: #d4a017;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="slide-num">{{slide_number}} / {{total_slides}}</div>

    <div class="label">{{label}}</div>

    <h1 class="title">{{title}}</h1>

    <div class="body">{{body}}</div>

    {{verses_html}}

    {{cta_html}}

    <div class="footer">
      <div class="church">
        {{church_name}}
        <div class="tagline">{{church_tagline}}</div>
      </div>
      <div class="cta-link">{{cta_text}}</div>
      <div class="page">{{slide_number}}/{{total_slides}}</div>
    </div>
  </div>
</body>
</html>
